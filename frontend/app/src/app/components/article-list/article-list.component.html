<div class="article-list-page">
  <header class="page-header">
    <h1>Articles</h1>
    <a routerLink="/articles/new" class="button primary-button">Create New Article</a>
  </header>

  <div *ngIf="isLoading" class="loading-indicator">
    <p>Loading articles...</p>
    <!-- Consider adding a more visually appealing spinner here -->
  </div>

  <div *ngIf="error" class="alert error-message">
    <p><strong>Error:</strong> {{ error }}</p>
  </div>

  <div *ngIf="!isLoading && !error" class="article-grid">
    <div *ngIf="articles.length > 0; else noArticles" class="articles-container">
      <div *ngFor="let article of articles" class="card article-card">
        <h2 class="article-title">
          <a [routerLink]="['/articles', article.slug]">
            {{ getDisplayTitle(article) }}
          </a>
        </h2>
        <p class="article-slug">Slug: {{ article.slug }}</p>
        <!-- <p class="article-excerpt">A short description or excerpt of the article...</p> -->
        <div class="article-meta">
          <span>Created: {{ article.created_at | date:'mediumDate' }}</span>
          <!-- Add more meta info if available, e.g., author -->
        </div>
        <a [routerLink]="['/articles', article.slug]" class="button read-more-button">Read More</a>
      </div>
    </div>
    <ng-template #noArticles>
      <div class="empty-state">
        <p>No articles found. Why not create one?</p>
        <a routerLink="/articles/new" class="button primary-button">Create First Article</a>
      </div>
    </ng-template>
  </div>
</div>
