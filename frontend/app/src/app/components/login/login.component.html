<div class="login-page">
  <div class="login-container card"> <!-- Apply .card for consistent container styling -->
    <header class="form-header">
      <h2>Login</h2>
    </header>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate class="login-form">
      <div class="form-group">
        <label for="username">Username:</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Enter your username"
          [ngClass]="{ 'is-invalid': username?.invalid && (username?.dirty || username?.touched) }"
        >
        <div *ngIf="username?.invalid && (username?.dirty || username?.touched)" class="validation-errors">
          <small *ngIf="username?.errors?.['required']">Username is required.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          [ngClass]="{ 'is-invalid': password?.invalid && (password?.dirty || password?.touched) }"
        >
        <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="validation-errors">
          <small *ngIf="password?.errors?.['required']">Password is required.</small>
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert error-message global-error">
        <p>{{ errorMessage }}</p>
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="loginForm.invalid || isSubmitting" class="button primary-button submit-button">
          {{ isSubmitting ? 'Logging in...' : 'Login' }}
        </button>
      </div>
    </form>
    <p class="register-link">
      Don't have an account? <a routerLink="/auth/register">Register here</a>
    </p>
  </div>
</div>
