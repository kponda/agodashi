<div class="form-page-container card">
  <header class="form-header">
    <h2>Create New Article</h2>
  </header>

  <form [formGroup]="articleForm" (ngSubmit)="onSubmit()" class="article-form">
    <section class="form-section main-details">
      <h3>Main Details</h3>
      <!-- Slug Field -->
      <div class="form-group">
        <label for="slug">Slug:</label>
        <input id="slug" type="text" formControlName="slug" placeholder="e.g., my-first-article">
        <div *ngIf="slug?.invalid && (slug?.dirty || slug?.touched)" class="validation-errors">
          <small *ngIf="slug?.errors?.['required']">Slug is required.</small>
          <small *ngIf="slug?.errors?.['pattern']">Slug must be lowercase alphanumeric with hyphens (e.g., 'my-article').</small>
        </div>
      </div>

      <!-- Author ID Field (Optional) -->
      <div class="form-group">
        <label for="author_id">Author ID (Optional):</label>
        <input id="author_id" type="number" formControlName="author_id" placeholder="e.g., 123">
        <div *ngIf="articleForm.get('author_id')?.invalid && (articleForm.get('author_id')?.dirty || articleForm.get('author_id')?.touched)" class="validation-errors">
          <small *ngIf="articleForm.get('author_id')?.errors?.['min']">Author ID must be a positive number.</small>
        </div>
      </div>
    </section>

    <section class="form-section translations-section">
      <h3>Translations</h3>
      <div formArrayName="translations">
        <div *ngFor="let translationGroup of translations.controls; let i=index" [formGroupName]="i" class="translation-group card">
          <header class="translation-header">
            <h4>Translation {{ i + 1 }}</h4>
            <button type="button" (click)="removeTranslation(i)" class="button danger-button small-button" *ngIf="translations.length > 1">
              Remove
            </button>
          </header>

          <div class="form-group">
            <label for="lang-{{i}}">Language Code:</label>
            <input id="lang-{{i}}" type="text" formControlName="language_code" placeholder="e.g., en, ja">
            <!-- Add validation messages for language_code if needed -->
          </div>

          <div class="form-group">
            <label for="title-{{i}}">Title:</label>
            <input id="title-{{i}}" type="text" formControlName="title" placeholder="Article Title">
            <!-- Add validation messages for title if needed -->
          </div>

          <div class="form-group">
            <label for="content-{{i}}">Content:</label>
            <textarea id="content-{{i}}" formControlName="content" rows="6" placeholder="Article content..."></textarea>
            <!-- Add validation messages for content if needed -->
          </div>

          <div class="form-group checkbox-group">
            <input id="is_published-{{i}}" type="checkbox" formControlName="is_published" class="styled-checkbox">
            <label for="is_published-{{i}}" class="checkbox-label">Publish this translation</label>
          </div>
        </div>
      </div>

      <button type="button" (click)="addTranslation()" class="button secondary-button add-translation-button">
        Add Another Translation
      </button>
    </section>

    <div *ngIf="error" class="alert error-message global-error">
      <p><strong>Error:</strong> {{ error }}</p>
    </div>

    <footer class="form-actions">
      <button type="submit" [disabled]="articleForm.invalid || isSubmitting" class="button primary-button submit-button">
        {{ isSubmitting ? 'Submitting...' : 'Create Article' }}
      </button>
      <a routerLink="/articles" class="button cancel-button">Cancel</a>
    </footer>
  </form>
</div>
