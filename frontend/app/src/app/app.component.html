<header class="app-header">
  <nav class="app-nav">
    <a routerLink="/" class="nav-logo">MyBlog</a>
    <a routerLink="/articles" class="nav-link" routerLinkActive="active">Articles</a>
    <a routerLink="/articles/new" class="nav-link" routerLinkActive="active">Create Article</a>
    <!-- Add other navigation links here -->
    <div class="auth-links">
      <!-- Example: Conditionally show login/logout or user profile link -->
      <!-- For actual implementation, you'd use a service to check auth state -->
      <a routerLink="/auth/login" class="button">Login</a>
      <!-- <a (click)="logout()" class="button">Logout</a> -->
    </div>
  </nav>
</header>

<main class="app-main-content">
  <!-- Wrap router-outlet in a container to apply consistent padding/max-width -->
  <div class="container">
    <router-outlet></router-outlet>
  </div>
</main>

<footer class="app-footer">
  <p>&copy; {{ currentYear }} Modern Blog Platform. All rights reserved.</p>
</footer>
